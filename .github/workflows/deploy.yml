name: Build & Publish Image (GitOps)

# Build half of the delivery pipeline. This workflow builds the image, pushes it
# to ECR, and records the new tag in k8s/kustomization.yaml. It does NOT touch
# the cluster — FluxCD pulls that commit and reconciles `sarc-aws` itself
# (see flux/janus.yaml). Nothing here holds kubectl credentials.

on:
  push:
    branches: [ main ]
    # The tag-bump commit below only changes k8s/kustomization.yaml. Ignoring
    # that path stops it re-triggering this workflow. (Belt and braces: pushes
    # made with the default GITHUB_TOKEN do not trigger workflow runs either.)
    # It also means a manifest-only change — an env var, an HPA bound — deploys
    # via Flux without a pointless image rebuild.
    paths-ignore:
      - 'k8s/**'
  workflow_dispatch:

permissions:
  contents: write # push the tag-bump commit
  id-token: write # AWS OIDC federation (short-lived credentials)

# Serialize: two merges landing together must not race on the tag-bump push.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v ./...

  build-and-publish:
    name: Build, Push ECR & Record Tag
    needs: validate-and-test
    # Pushing to ECR targets OUR AWS account (796973489124) via an OIDC trust
    # that only exists for this repo. On mirrors (e.g. the Synechron fork) there
    # is no AWS_DEPLOY_ROLE_ARN / OIDC trust, so this job would fail at
    # "Configure AWS Credentials". Skip it everywhere except the canonical repo —
    # validate-and-test still runs on mirrors, so the workflow stays green.
    if: github.repository == 'olafkfreund/janus'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # GitHub OIDC federation: short-lived credentials, no stored static keys.
      # Requires the IAM role + trust policy from deployment/GITHUB_OIDC_SETUP.md
      # and the AWS_DEPLOY_ROLE_ARN repo variable. The role now only needs ECR
      # push rights — its EKS access is no longer used by this pipeline.
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-janus-publish
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: janus
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      # The handoff to CD. Flux is watching this file; committing the immutable
      # SHA tag is what actually triggers the rollout. Never deploy by moving
      # `:latest` — under GitOps nothing would notice the image changed.
      - name: Record Image Tag for Flux
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          curl -sSLo /tmp/kustomize.tgz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tgz -C /tmp
          cd k8s
          /tmp/kustomize edit set image "$REGISTRY/janus:${{ github.sha }}"
          cd ..

          if git diff --quiet -- k8s/kustomization.yaml; then
            echo "Image tag unchanged — nothing to commit."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "chore(deploy): janus image ${GITHUB_SHA::7} [skip ci]"

          # Another merge may have landed while we were building. Rebase onto it
          # rather than failing the deploy; our change is a single scalar field.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Tag recorded on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main."
            git pull --rebase origin main
          done
          echo "::error::Could not record the image tag after 3 attempts."
          exit 1

      - name: Deployment Handoff Notice
        run: |
          echo "Image pushed and tag committed. FluxCD reconciles sarc-aws within ~1 minute."
          echo "Watch it with:  flux get kustomization janus --watch"
