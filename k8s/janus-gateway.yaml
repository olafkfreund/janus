# Pipeline-applied manifest (GHA deploy.yml). Stateless, Postgres-backed gateway.
#
# Managed OUT-OF-BAND (not here):
#   - Namespace `janus`                      (cluster-scoped)
#   - Secret  `mcp-gateway-secrets`          (jwt-secret, gateway-token, db-password, database-url)
#   - Postgres `janus-db`                    (k8s/janus-db.yaml)
#   - HPA + PodDisruptionBudget              (k8s/janus-scaling.yaml)
#
# `replicas` is intentionally omitted so the HorizontalPodAutoscaler owns the count
# (a plain apply would otherwise reset it on every deploy).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-api-gateway
  namespace: janus
  labels:
    app: mcp-api-gateway
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mcp-api-gateway
  template:
    metadata:
      labels:
        app: mcp-api-gateway
    spec:
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: mcp-api-gateway
      containers:
      - name: gateway
        image: 796973489124.dkr.ecr.eu-west-2.amazonaws.com/janus:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true # stateless: state lives in Postgres
          runAsNonRoot: true
          runAsUser: 10001
          capabilities:
            drop:
            - ALL
        env:
        - name: PORT
          value: "8080"
        # System of record: in-cluster Postgres (shared by all replicas).
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mcp-gateway-secrets
              key: database-url
        # Shared, encrypted vault backed by the same Postgres (consistent across
        # all replicas, survives restarts). Encryption key falls back to JWT_SECRET
        # unless VAULT_ENCRYPTION_KEY is set.
        - name: VAULT_PROVIDER
          value: "postgres"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mcp-gateway-secrets
              key: jwt-secret
        - name: GATEWAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: mcp-gateway-secrets
              key: gateway-token
        # Local admin login (until SSO/OIDC is configured). Username defaults to
        # "admin"; password comes from the secret. Remove once OIDC is set up.
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mcp-gateway-secrets
              key: admin-password
        - name: SEED_DEMO_DATA
          value: "true"
        - name: EGRESS_ALLOW_PRIVATE
          value: "true"
        - name: CONFIG_CACHE_TTL
          value: "5s"
        - name: SECRET_CACHE_TTL
          value: "30s"
        - name: RESPONSE_CACHE_TTL
          value: "10s"
        # Pool sizing must close against the fleet: maxReplicas (10) x DB_MAX_OPEN_CONNS
        # must stay under janus-db's max_connections=200, with headroom for the
        # superuser reserve and any admin session. 10 x 15 = 150. The previous 25
        # allowed 250 and would have hit "too many clients" at ~8 pods — exactly
        # under peak load. The token cache removed the per-request auth query, so
        # 15 is comfortably sufficient.
        - name: DB_MAX_OPEN_CONNS
          value: "15"
        - name: DB_MAX_IDLE_CONNS
          value: "5"
        # Shed excess concurrent tool calls instead of growing goroutines until OOM.
        - name: MCP_MAX_CONCURRENT_CALLS
          value: "200"
        # Per-authenticated-client rate limit (the per-IP limit is only a coarse
        # DoS guard, since enterprise clients share one NAT egress address).
        - name: MCP_RATE_PER_CLIENT
          value: "50"
        - name: MCP_BURST_PER_CLIENT
          value: "100"
        - name: DOWNSTREAM_RETRIES
          value: "2"
        # The nginx ingress already terminates TLS (cert-manager, secret `janus-tls`).
        # This just tells the portal to report edge TLS correctly instead of "unencrypted".
        - name: TLS_TERMINATED_AT_PROXY
          value: "true"
        # Optional mTLS is enforced at the ingress (auth-tls-* annotations above);
        # this makes the portal report the posture. Prerequisite: the janus-client-ca
        # Secret must exist (see deployment/mtls/README.md). "optional" is non-breaking.
        - name: MTLS_MODE
          value: "optional"
        # HPA utilization is measured against the REQUEST, not the limit. With a
        # 100m request and a 70% target, a pod using a routine 400m reported 400%
        # and slammed the deployment straight to maxReplicas on modest load — then
        # had nowhere left to scale. A 400m request makes the 70% target mean what
        # it says and keeps scaling proportional to real load.
        resources:
          requests:
            cpu: "400m"
            memory: "256Mi"
          limits:
            # "1", not "1000m": the API server normalises 1000m to 1 on write, so
            # a manifest saying "1000m" never matches the stored value and Flux's
            # server-side apply reports a field-ownership conflict instead of
            # adopting the Deployment. Same quantity, canonical spelling.
            cpu: "1"
            memory: "512Mi"
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          failureThreshold: 30
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        volumeMounts:
        - name: vault-tmp
          mountPath: /app/data
      volumes:
      - name: vault-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-api-gateway
  namespace: janus
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  selector:
    app: mcp-api-gateway
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-api-gateway
  namespace: janus
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    nginx.ingress.kubernetes.io/session-cookie-hash: "sha1"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # Optional mTLS. Requires the `janus-client-ca` Secret (managed out-of-band;
    # see deployment/mtls/README.md). "optional" verifies a client cert IF one is
    # presented (rejecting certs not signed by our CA) but still admits token-only
    # clients, so Claude/Antigravity/Copilot keep working. Do NOT switch to "on"/
    # "required" without issuing client certs to every client first.
    nginx.ingress.kubernetes.io/auth-tls-secret: "janus/janus-client-ca"
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "optional"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
spec:
  tls:
  - hosts:
    - janus.13.134.88.9.nip.io
    secretName: janus-tls
  rules:
  - host: janus.13.134.88.9.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-api-gateway
            port:
              number: 8080
