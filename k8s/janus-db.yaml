# In-cluster Postgres for janus (mirrors the fides-db pattern — no RDS cost).
# Reconciled by Flux via k8s/kustomization.yaml. The gateway points at the
# `janus-db` Service via DATABASE_URL (in mcp-gateway-secrets).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: janus-db-pvc
  namespace: janus
  annotations:
    # This is the whole database. The gp3 StorageClass reclaims with Delete, so
    # letting Flux garbage-collect this PVC — which it would do the moment this
    # resource stops appearing in the rendered output, e.g. a bad refactor of
    # kustomization.yaml — destroys the volume and every connection, endpoint,
    # client token and vault secret in it. Deleting the data must stay a
    # deliberate manual act, never a side effect of a git diff.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: gp3
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: janus-db
  namespace: janus
  labels:
    app: janus-db
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: janus-db
  template:
    metadata:
      labels:
        app: janus-db
    spec:
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
      containers:
      - name: postgres
        image: postgres:15-alpine
        # Raise max_connections above the stock default (100) to match the fleet at
        # HPA scale: pairs with the lowered per-pod DB_MAX_OPEN_CONNS default (10) in
        # pkg/config/config.go — 10 conns/pod * 10 pods (HPA max) = 100, leaving
        # headroom under this 200 ceiling for idle conns and out-of-band admin access.
        args: ["-c", "max_connections=200"]
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: mcp_gateway
        - name: POSTGRES_USER
          value: janus
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mcp-gateway-secrets
              key: db-password
        # Use a subdirectory so initdb does not trip over lost+found on the volume.
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            # "1", not "1000m" — see the note in janus-gateway.yaml: the stored
            # value is normalised to "1", and a mismatch blocks Flux's
            # server-side apply from adopting this Deployment.
            cpu: "1"
            memory: "1Gi"
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U janus -d mcp_gateway"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U janus -d mcp_gateway"]
          initialDelaySeconds: 20
          periodSeconds: 20
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: janus-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: janus-db
  namespace: janus
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: janus-db
