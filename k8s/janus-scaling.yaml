# Autoscaling + disruption budget for the stateless Postgres-backed gateway.
# Reconciled by Flux via k8s/kustomization.yaml. The HPA owns the Deployment's
# replica count — which is why janus-gateway.yaml omits `replicas` entirely.
# That omission is what keeps Flux and the HPA from fighting: with no `replicas`
# field in the rendered output, Flux's server-side apply never claims ownership
# of it, so scaling decisions stay with the HPA across every reconcile.
#
# Multi-replica is safe: the primary MCP transport is now Streamable HTTP
# (POST /mcp or POST /sse) which is STATELESS — each request is authenticated by
# its bearer token and any replica can serve it (system of record is Postgres).
# NOTE: the LEGACY HTTP+SSE transport (GET /sse + POST /messages) is still
# stateful (SSE stream pinned to one pod); clients using it need sticky sessions
# or the /mcp endpoint. Prefer Streamable HTTP for scale-out.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mcp-api-gateway
  namespace: janus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mcp-api-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-api-gateway
  namespace: janus
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: mcp-api-gateway
